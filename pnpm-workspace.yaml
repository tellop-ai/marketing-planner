# pnpm settings for this app, which is its own workspace root.
#
# The supply-chain policy: a dependency version published less than 14 days ago
# cannot be installed (minimumReleaseAge, in minutes); no dependency runs an
# install script unless it is named here (strictDepBuilds), and sharp's is
# refused because the app serves no optimized images; sub-dependencies from
# exotic sources are blocked; and the lockfile is not trusted for a resolution
# these rules would reject.

packages: []

minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  - "next@16.4.3"
  - "@next/env@16.4.3"
  - "@next/swc-darwin-x64@16.4.3"
  - "@next/swc-darwin-arm64@16.4.3"
  - "@next/swc-linux-x64-gnu@16.4.3"
  - "@next/swc-linux-x64-musl@16.4.3"
  - "@next/swc-win32-x64-msvc@16.4.3"
  - "@next/swc-linux-arm64-gnu@16.4.3"
  - "@next/swc-linux-arm64-musl@16.4.3"
  - "@next/swc-win32-arm64-msvc@16.4.3"

strictDepBuilds: true
dangerouslyAllowAllBuilds: false
onlyBuiltDependencies: []
ignoredBuiltDependencies: []
allowBuilds:
  sharp: false

blockExoticSubdeps: true
trustLockfile: false

overrides:
  "@stellar/stellar-sdk@16.3.0>axios": 1.20.0
